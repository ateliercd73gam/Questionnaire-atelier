<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Backstage — Signalétique Pleine Nature</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>
</head>
<body>

  <main class="center-page" id="gate" style="display:none;">
    <div class="inner">
      <form class="gate-form" id="gateForm" autocomplete="off" style="max-width:none;">
        <input type="text" placeholder="mot de passe" aria-label="Mot de passe" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit" aria-label="Valider">→</button>
      </form>
    </div>
  </main>

  <div id="dash" style="display:none;">
    <header class="results-bar">
      <span class="count"><span id="totalResponses">0 réponse</span><span class="status" id="status"></span></span>
      <div class="actions">
        <button class="btn" onclick="refreshResults(this)">actualiser</button>
        <button class="btn" onclick="exportXLSX(this)">export excel</button>
        <button class="btn" onclick="lockAndLeave()">retour</button>
      </div>
    </header>

    <main class="results-wrap">
      <p class="local-note" id="localNote" style="display:none;">Mode local : aucun Google Sheet relié, les réponses restent sur ce navigateur.</p>

      <div class="stats-row" id="statsRow"></div>

      <div class="panel">
        <div class="panel-title">Lecture des panneaux</div>
        <div id="barChart"></div>
      </div>

      <h2 class="results-h">Heatmaps</h2>
      <div class="heatmaps-grid" id="heatmapsGrid"></div>

      <div style="margin-top:32px;">
        <button class="btn btn-danger" onclick="openDeleteModal()">supprimer toutes les données</button>
      </div>
    </main>
  </div>

  <div class="modal" id="delModal" hidden>
    <div class="modal-box">
      <div id="delStep1">
        <h3>Supprimer toutes les réponses ?</h3>
        <p id="delCount"></p>
        <div class="modal-actions">
          <button class="btn" data-close>annuler</button>
          <button class="btn btn-primary" onclick="deleteStep2()">continuer</button>
        </div>
      </div>
      <div id="delStep2" hidden>
        <h3>Confirmation finale</h3>
        <p>Cette action est irréversible. Tapez <b>supprimer</b> pour confirmer.</p>
        <input class="modal-input" id="delInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="supprimer">
        <p class="err" id="delErr"></p>
        <div class="modal-actions">
          <button class="btn" data-close>annuler</button>
          <button class="btn btn-danger" id="delGo" onclick="confirmDelete()" disabled>supprimer définitivement</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js?v=4"></script>
  <script src="js/db.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
  <script src="js/results.js?v=4"></script>
  <script src="js/export.js?v=4"></script>
  <script>
    const gateEl = document.getElementById('gate');
    const dashEl = document.getElementById('dash');

    function showDashboard () {
      gateEl.style.display = 'none';
      dashEl.style.display = 'block';
      startResults();
    }
    function showGate () {
      stopResults();
      dashEl.style.display = 'none';
      gateEl.style.display = 'flex';
      document.querySelector('#gateForm input').focus();
    }
    async function lockAndLeave () {
      await DB.signOut();
      window.location.href = 'index.html';
    }

    bindDeleteModal();
    bindGateForm(document.getElementById('gateForm'), () => {});
    DB.onAuth(signedIn => (signedIn ? showDashboard() : showGate()), err => {
      console.error(err);
      showGate();
    });
  </script>
</body>
</html>
